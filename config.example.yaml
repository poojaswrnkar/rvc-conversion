# Copy to `config.yaml` locally (do not commit secrets)

qwen:
  base_url: "http://localhost:8000/v1"
  api_key: "local-no-key"
  model: "Qwen/Qwen3.6-35B-A3B-FP8"
  timeout_s: 180

tts:
  nobita_voice: "en-IN-PrabhatNeural"
  doraemon_voice: "en-IN-NeerjaNeural"
  rate: "+0%"
  volume: "+0%"

rvc:
  enabled: false
  # Interpreter with torch + Applio deps (recommended). Same as export APPLIO_PYTHON=...
  # python: "/home/you/miniconda3/envs/applio-py310/bin/python"
  cli_path: "./applio_segment_infer.py"
  extra_args: ""
  models:
    nobita: "./models/nobita.pth"
    doraemon: "./models/doraemon.pth"
    nobita_index: "./models/nobita.index"
    doraemon_index: "./models/doraemon.index"

comfyui:
  enabled: false
  base_url: "http://127.0.0.1:8188"
  # Bundled vanilla txt2img → SaveImage (paths are relative to this YAML file).
  workflow_json_path: "./comfy/workflows/character_gen.json"
  # Same graph by default; PNG/JPEG outputs are turned into per-segment MP4 via ffmpeg.
  video_workflow_json_path: "./comfy/workflows/video_clip.json"
  # Must match a filename under ComfyUI/models/checkpoints/ on the Comfy host (see comfy/workflows/*.json).
  # Default in JSON matches Comfy's usual v1.5 name once you download it:
  #   wget -O models/checkpoints/v1-5-pruned-emaonly-fp16.safetensors \
  #     "https://huggingface.co/Comfy-Org/stable-diffusion-v1-5-archive/resolve/main/v1-5-pruned-emaonly-fp16.safetensors"
  checkpoint: null
  poll_timeout_s: 180
